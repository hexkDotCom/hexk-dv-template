# SPDX-License-Identifier: 0BSD
#
# Lint, elaboration against UVM 1.2 and 2020, unit tests and the smoke test on Verilator, in the
# hexk-dv-toolbox image, on every push and pull request. Change the image line to adopt a newer
# toolbox release; the digest pins the exact image.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/hexkdotcom/hexk-dv-toolbox:2026.10.0
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: hexk-dv-check

      - name: make ci
        run: make ci

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/**/*.log
          if-no-files-found: ignore
